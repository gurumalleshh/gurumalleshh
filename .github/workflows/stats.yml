name: Update Profile Stats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats cards from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: gurumalleshh
        run: |
          mkdir -p profile
          node <<'NODE'
          const fs = require('fs');

          const user = process.env.GH_USER;
          const token = process.env.GH_TOKEN;
          const headers = {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };

          async function api(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${url}`);
            }
            return response.json();
          }

          function escapeXml(value) {
            return String(value).replace(/[&<>"']/g, c => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;',
              '"': '&quot;', "'": '&apos;'
            })[c]);
          }

          const palette = {
            bg: '#0d1117',
            panel: '#161b22',
            border: '#30363d',
            text: '#e6edf3',
            muted: '#8b949e',
            cyan: '#22d3ee',
            purple: '#a78bfa'
          };

          function card(title, inner, height = 230) {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="495" height="${height}" viewBox="0 0 495 ${height}">
              <rect x="1" y="1" width="493" height="${height - 2}" rx="12" fill="${palette.bg}" stroke="${palette.border}"/>
              <text x="25" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="${palette.cyan}">${escapeXml(title)}</text>
              ${inner}
            </svg>`;
          }

          function txt(x, y, content, size = 14, color = palette.text, weight = 400) {
            return `<text x="${x}" y="${y}" font-family="Segoe UI,Arial,sans-serif" font-size="${size}" font-weight="${weight}" fill="${color}">${escapeXml(content)}</text>`;
          }

          async function main() {
            const [profile, repos] = await Promise.all([
              api(`https://api.github.com/users/${user}`),
              api(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`)
            ]);

            const publicRepos = repos.filter(r => !r.fork);
            const stars = repos.reduce((sum, r) => sum + r.stargazers_count, 0);
            const forks = repos.reduce((sum, r) => sum + r.forks_count, 0);

            let stats = '';
            const rows = [
              ['Public repositories', publicRepos.length],
              ['Stars received', stars],
              ['Forks across repositories', forks],
              ['Followers', profile.followers],
              ['Following', profile.following],
              ['Public repos updated via API', repos.length]
            ];
            rows.forEach((row, i) => {
              const y = 73 + i * 25;
              stats += txt(25, y, row[0], 14, palette.muted);
              stats += txt(466, y, row[1], 15, palette.text, 700).replace('x="466"', 'x="466" text-anchor="end"');
            });
            fs.writeFileSync('profile/stats.svg', card('GitHub Overview', stats, 225));

            const totals = {};
            for (const repo of publicRepos) {
              try {
                const langs = await api(repo.languages_url);
                for (const [name, bytes] of Object.entries(langs)) {
                  totals[name] = (totals[name] || 0) + bytes;
                }
              } catch (error) {
                console.warn(`Skipping languages for ${repo.name}: ${error.message}`);
              }
            }

            const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const totalBytes = sorted.reduce((sum, item) => sum + item[1], 0) || 1;
            const colors = ['#22d3ee', '#a78bfa', '#34d399', '#fbbf24', '#fb7185', '#60a5fa'];
            let languages = '';
            if (!sorted.length) {
              languages += txt(25, 80, 'No language data found in public non-fork repositories.', 13, palette.muted);
            } else {
              let start = 25;
              const barWidth = 445;
              for (let i = 0; i < sorted.length; i++) {
                const width = barWidth * sorted[i][1] / totalBytes;
                languages += `<rect x="${start}" y="58" width="${Math.max(width, 1)}" height="10" rx="3" fill="${colors[i]}"/>`;
                start += width;
              }
              sorted.forEach(([name, bytes], i) => {
                const y = 98 + i * 25;
                const percent = (bytes / Object.values(totals).reduce((a, b) => a + b, 0) * 100).toFixed(1);
                languages += `<circle cx="31" cy="${y - 5}" r="5" fill="${colors[i]}"/>`;
                languages += txt(45, y, name, 13, palette.text, 600);
                languages += txt(465, y, `${percent}%`, 13, palette.muted, 600).replace('x="465"', 'x="465" text-anchor="end"');
              });
            }
            languages += txt(25, 218, 'Calculated from public, non-fork repository code sizes.', 10, palette.muted);
            fs.writeFileSync('profile/top-langs.svg', card('Top Languages • Public Repositories', languages, 235));
            console.log(`Generated profile cards for @${user}: ${publicRepos.length} public non-fork repos, ${stars} stars.`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git commit -m "Update GitHub profile stats"
          git push
